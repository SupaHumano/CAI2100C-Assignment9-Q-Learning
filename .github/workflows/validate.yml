name: Validate and publish Assignment 9 Q-Learning
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'academic/**'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out my academic source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook and verification packages
        run: python -m pip install -r requirements.txt
      - name: Execute my exact academic notebook to regenerate results
        run: |
          python - <<'PY'
          import pathlib
          import nbformat
          from nbclient import NotebookClient
          path=pathlib.Path('academic/CAI2100C_Assignment_9_Q_Learning_Juan_Luna_Santibanez.ipynb')
          nb=nbformat.read(path,as_version=4)
          NotebookClient(nb,kernel_name='python3',timeout=180,allow_errors=False,
                         resources={'metadata':{'path':str(pathlib.Path.cwd())}}).execute()
          assert sum(c.cell_type=='code' and c.execution_count is not None for c in nb.cells)==11
          assert not any(o.output_type=='error' for c in nb.cells for o in c.get('outputs',[]))
          print('PASS: My full academic notebook executed from the published source',flush=True)
          PY
      - name: Generate optional presentation from the verified charts
        run: python scripts/build_presentation.py
      - name: Audit code, notebook outputs, web data and fresh Colab-style runtime
        run: python tests/verify_assignment.py --fresh-runtime
      - name: Record reproducible outputs without changing my academic notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path.cwd()
          paths=sorted(
            p for p in root.rglob('*') if p.is_file()
            and '.git' not in p.parts
            and '__pycache__' not in p.parts
            and p.name!='SHA256SUMS.txt'
            and p.suffix!='.pyc'
          )
          (root/'SHA256SUMS.txt').write_text(
            '\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}" for p in paths)+'\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ data/results.json data/results.js presentation/ SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record fully verified Q-Learning figures and outputs'
            git push
          fi
